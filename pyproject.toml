[project]
name = "daily-market-content-pack"
version = "0.2.0"
description = "Deterministic daily market content and analysis pipeline"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "openinference-instrumentation>=0.1.0",
  "opentelemetry-api>=1.30.0",
  "opentelemetry-sdk>=1.30.0",
  "opentelemetry-exporter-otlp>=1.30.0",
  "arize-phoenix==17.0.0",
  "pydantic-ai-slim==1.95.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
